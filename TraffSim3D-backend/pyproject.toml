[project]
name = "traffsim3d-backend"
version = "0.1.0"
description = "TraffSim3D backend: FastAPI + PyTorch multi-agent RL service for 3D traffic simulation"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",  # required for UploadFile endpoints
    # certifi's bundled CA store shipped revoked emSign roots (PYSEC-2026-4320)
    # until 2026.10.19. It arrives transitively (requests/httpx), so the floor
    # has to be stated here — a transitive constraint alone is not installable.
    "certifi>=2026.10.19",
    "gymnasium>=1.3.0",
    "numpy>=2.5.0",
    "pbf>=0.2.0",
    "osmium>=4.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx2>=0.30",        # required by starlette 1.3+ TestClient
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]
rl = [
    "stable-baselines3>=2.2",
]
# PyTorch is intentionally NOT pinned here — it is added with the RL engine.
# Pinning now risks 2 GB+ installs of a torch version that may not have wheels for the local Python.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["E501"]  # line-length handled by formatter

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]  # required so `from app.main import app` resolves from tests/ without a conftest.py

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest-cov",
]

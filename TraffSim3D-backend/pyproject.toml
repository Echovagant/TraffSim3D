[project]
name = "traffsim3d-backend"
version = "0.1.0"
description = "TraffSim3D backend: FastAPI + PyTorch multi-agent RL service for 3D traffic simulation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",         # for FastAPI TestClient async tests
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]
# PyTorch is intentionally NOT pinned here yet — added in M4 when the RL engine lands.
# Pinning now risks 2 GB+ installs of a torch version that may not have wheels for the local Python.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["E501"]  # line-length handled by formatter

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]  # required so `from app.main import app` resolves from tests/ without a conftest.py

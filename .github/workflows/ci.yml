# TraffSim3D — continuous integration.
#
# This repository had no CI at all before this file: every gate below was
# run by hand. They are wired up here because the cross-language contract
# test compares two *independent* implementations of the same
# traffic model with exact equality — without a machine-run gate, drift goes
# unnoticed until somebody reads a diff by eye.
#
# Jobs
# -----
#   backend   pytest (+ coverage gate) + ruff + black + openapi drift gate
#   frontend  vitest (+ coverage) + vue-tsc + eslint + prettier + openapi types
#   contract  Python sim  <->  TypeScript goldens   (the important one)
#   e2e       Playwright against a live frontend + backend (BLOCKING)
#   e2e-real  ONE real PPO training run, end to end  (the second BLOCKING one)
#
# Read the comment above the `contract` job before changing anything: it is
# the one that protects the model. Read the comment above `e2e` before
# changing that job, and the comment above `e2e-real` before changing that
# one: it is the only place in CI where the real RL engine ever runs.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Python 3.12 is what the project venv runs (requires-python = ">=3.12,<3.14").
  PYTHON_VERSION: '3.12'
  # package.json engines: "^20.19.0 || >=22.12.0" -> Node 22 is allowed.
  NODE_VERSION: '22'
  # Distinct ports, so the frontend and the backend can never collide with
  # each other. 5173 is deliberately avoided: it is the project's default
  # vite port and the one `playwright.config.ts` hard-codes.
  FRONTEND_PORT: '5188'
  BACKEND_PORT: '8001'
  # Faster PyPI mirror first (the project's toolchain note for slow
  # networks). The install steps fall back to pypi.org if the mirror fails.
  PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

jobs:
  backend:
    name: Backend — pytest / ruff / black
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TraffSim3D-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: TraffSim3D-backend/pyproject.toml

      - name: Install the backend (dev + rl extras)
        run: |
          # Two things are easy to get wrong here:
          #
          # 1. `pytest-cov` is NOT part of the `dev` extra. It lives in the
          #    `[dependency-groups]` table, and `pip install .` does not
          #    install dependency groups. Without it, `pytest --cov=app`
          #    dies with "unrecognized arguments: --cov". Hence the
          #    explicit mention.
          # 2. The `rl` extra pulls in stable-baselines3 (+ torch). It is
          #    required: without SB3 the suite silently takes its "no-SB3
          #    fallback" paths and the RL engine is never exercised.
          #
          # The mirror is tried first; if it is unreachable, retry against
          # PyPI directly (the `--index-url` overrides the job-level
          # PIP_INDEX_URL for that retry).
          python -m pip install -e ".[dev,rl]" pytest-cov \
            || python -m pip install -e ".[dev,rl]" pytest-cov \
                 --index-url https://pypi.org/simple

      - name: pytest + coverage
        # `--cov-fail-under=70` is what turns the documented 70% threshold
        # into an actual gate: on its own `--cov=app` only *reports* the
        # number, so coverage could decay silently. Measured locally on
        # 2026-10-24: 89.27%.
        #
        # The output is teed to a file and, when the run fails, the failing
        # test names are re-published as **workflow annotations**. A hosted
        # runner's job log is only readable with admin rights, but the
        # check-run annotations are public — so without this a red backend
        # job says only "Process completed with exit code 1" and the
        # failing tests have to be guessed at.
        run: |
          # `set +e` around the pipeline: the exit code is captured by
          # hand below, so errexit (and pipefail, if it is ever turned on)
          # must not abort the step before the diagnosis is published.
          set +e
          python -m pytest --cov=app --cov-fail-under=70 -q -ra 2>&1 | tee /tmp/pytest.log
          STATUS=${PIPESTATUS[0]}
          set -e
          emit() { local l="${1:0:400}"; echo "::${2}::${l//\%/%25}"; }
          if [ "$STATUS" -ne 0 ]; then
            emit "pytest failed (exit $STATUS) — the failing tests are named below" error
            grep -E '^(FAILED|ERROR) ' /tmp/pytest.log | head -10 | while IFS= read -r line; do
              emit "$line" error
            done
            emit "--- the tail of the pytest output follows as warnings ---" error
            tail -25 /tmp/pytest.log | while IFS= read -r line; do
              emit "$line" warning
            done
          fi
          exit "$STATUS"

      - name: ruff
        # The repository deliberately keeps 6 ruff findings. Each one is
        # waived individually below — nothing is blanket-ignored, and no
        # finding is deleted to make the linter quiet:
        #
        #   app/api/v1/maps.py       B008  x2 — FastAPI's `File()` in a
        #                                        default argument is the
        #                                        documented FastAPI idiom.
        #   app/apps/rl/sim_core.py  N806  — the protected contract module;
        #                                        `R` is intentional.
        #   geojson/geojson2osm.py    UP009 — UTF-8 coding declaration.
        #                             UP015 — redundant "r" file mode.
        #                             F841  — unused local `node`.
        #
        # Note that ruff's per-file-ignores need the fully-qualified
        # "path:rule" form for every single rule: the shorthand
        # "path:rule1,rule2" is rejected by ruff 0.17.
        run: |
          python -m ruff check . --output-format=concise \
            --per-file-ignores="app/api/v1/maps.py:B008" \
            --per-file-ignores="app/apps/rl/sim_core.py:N806" \
            --per-file-ignores="geojson/geojson2osm.py:UP009" \
            --per-file-ignores="geojson/geojson2osm.py:UP015" \
            --per-file-ignores="geojson/geojson2osm.py:F841"

      - name: black
        # `--extend-exclude`, never `--exclude`: `black --exclude` REPLACES
        # black's default exclusion list, which is why `.venv` is not in it.
        # One `black . --exclude` run once reformatted 1983 files — the
        # entire site-packages of the local venv — which git cannot undo
        # because .venv is gitignored.
        run: python -m black --check . --extend-exclude 'app/apps/rl/sim_core.py'

      - name: OpenAPI schema is in step with the app
        # `docs/openapi.json` is the committed snapshot of the FastAPI
        # schema. `--check` regenerates it in memory and fails when the
        # file on disk differs — so an endpoint change that forgot to
        # re-export the schema is caught here instead of silently
        # shipping a stale API document (and stale generated TS types).
        #
        # The comparison is byte-exact, which is why `docs/openapi.json`
        # is pinned to LF in `.gitattributes`: git's CRLF checkout on
        # Windows would otherwise make the check fail on a pristine
        # clone even when nothing drifted.
        run: python scripts/export_openapi.py --check

  frontend:
    name: Frontend — vitest / vue-tsc / eslint / prettier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TraffSim3D-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: TraffSim3D-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests + coverage
        # `test:coverage` runs the same suite as `test:run` (`vitest run`)
        # and adds the coverage report, so running both would double the
        # job's wall clock for no extra signal.
        run: npm run test:coverage

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Lint
        # No `--fix` here: CI reports, it does not rewrite the tree.
        run: npx eslint .

      - name: Format check
        run: npx prettier --check .

      - name: Generated OpenAPI types are up to date
        # The frontend's API types are generated from `docs/openapi.json`.
        # This check fails when the generated file drifted from the
        # committed schema, so a backend endpoint change cannot leave
        # the frontend silently out of sync.
        run: npm run api:types:check

  contract:
    name: Contract — Python sim ⇄ TypeScript goldens
    runs-on: ubuntu-latest
    steps:
      # BOTH sides are needed, and BOTH of the steps below are required.
      #
      #   1. `pytest tests/contract/` runs the **live Python sim** and
      #      compares it, field by field, with the committed TypeScript
      #      goldens in `tests/contract/snapshots/ts_*.json`. Equality is
      #      exact — no tolerance — because both sides run the same
      #      floating-point operation sequence.
      #
      #   2. `npm run contract:check` re-generates those goldens from the
      #      **TypeScript sources** and fails if they no longer match.
      #
      # Step 1 alone is NOT enough, and this is the single most important
      # thing to know about this file: the goldens are committed artefacts.
      # If someone changes `src/application/services/simCoreMirror.ts` (or
      # `tick.ts`), the Python sim still matches the *old* golden, so step 1
      # stays green while the TypeScript implementation has silently drifted
      # away from the model. Step 2 is what detects that.
      #
      # Conversely, step 2 alone is not enough either: it only proves the
      # goldens match the TypeScript code, not that the two implementations
      # agree.
      #
      # Together they are the contract. Keep both.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: TraffSim3D-backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: TraffSim3D-frontend/package-lock.json

      - name: Install the backend (dev + rl extras)
        working-directory: TraffSim3D-backend
        run: |
          python -m pip install -e ".[dev,rl]" \
            || python -m pip install -e ".[dev,rl]" \
                 --index-url https://pypi.org/simple

      - name: Install the frontend
        working-directory: TraffSim3D-frontend
        run: npm ci

      - name: Python sim vs the committed TypeScript goldens
        working-directory: TraffSim3D-backend
        run: python -m pytest tests/contract/ -v

      - name: TypeScript sources vs the committed goldens
        working-directory: TraffSim3D-frontend
        run: npm run contract:check

  e2e:
    name: E2E — Playwright (blocking)
    runs-on: ubuntu-latest
    # ------------------------------------------------------------------
    # THIS JOB IS A GATE.
    #
    # It used to carry `continue-on-error: true`, which made every
    # browser-side regression invisible to the pipeline: the specs ran,
    # the output was readable, and the red X did not block anything.
    #
    # Two things made it non-blocking, and only one of them still holds:
    #
    #   1. The visual-regression baselines in `e2e-output/baseline/`
    #      were recorded on **Windows + Chromium 1228 (headless,
    #      SwiftShader)**. A Linux runner has a different Chromium build
    #      and a different font rasterisation, so the pixel comparisons
    #      differ even when nothing regressed. The measured tolerance
    #      (`maxDiffPixelRatio: 0.005`) is derived from real runs on
    #      the recording platform and MUST NOT be raised to paper over
    #      this — doing so would also hide genuine rendering
    #      regressions, which is the entire purpose of those baselines.
    #
    #      This is now handled *inside the specs* rather than by
    #      downgrading the whole job: `tests/e2e/helpers/visual.ts`
    #      skips the pixel comparison on any platform other than the
    #      one the baselines were recorded on, with a visible
    #      annotation. Everything else in those specs (the behaviour
    #      assertions) still runs and still gates. Re-recording the
    #      baselines on Linux would make the pixel comparisons
    #      comparable again.
    #
    #   2. `perf-gate.spec.ts` used to assert `avg >= 30 FPS`, which
    #      is unreachable under software rasterisation. It now asserts
    #      only what is conclusive (the sim advances, the readings are
    #      finite, the page has not collapsed below a hard floor) and
    #      *reports* the 30 FPS target. So it can gate.
    #
    # The frontend runs on 5188 and the backend on 8001 (see the env
    # block) — 5173 is never used here, because it is the project's
    # default vite port and is often taken by another project on a
    # developer machine.
    # ------------------------------------------------------------------
    defaults:
      run:
        working-directory: TraffSim3D-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: TraffSim3D-backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: TraffSim3D-frontend/package-lock.json

      - name: Install the backend (base dependencies only)
        # The e2e specs mostly exercise the frontend, and the ones that
        # talk to the backend stub the endpoints they use. A minimal
        # backend on :8001 is therefore enough — no RL extra, no torch.
        working-directory: TraffSim3D-backend
        run: |
          python -m pip install -e . \
            || python -m pip install -e . --index-url https://pypi.org/simple

      - name: Install the frontend
        run: npm ci

      - name: Install the Playwright browser
        # `--with-deps` pulls the Linux system libraries Chromium needs
        # (libnss3, libatk, ...). Without it the browser fails to launch
        # on a bare runner.
        run: npx playwright install --with-deps chromium

      - name: Generate the CI-only Playwright config
        # `playwright.config.ts` hard-codes use.baseURL and webServer.url
        # to http://localhost:5173 and starts vite on its default port.
        # The CI job must run the frontend on 5188 so it can never collide
        # with the backend on 8001, and the shared `playwright.config.ts`
        # is not this workflow's file to edit.
        #
        # Playwright gives the config's `use.baseURL` precedence over the
        # PLAYWRIGHT_TEST_BASE_URL environment variable (the project `use`
        # overrides the built-in option fixture), so the env var alone
        # cannot redirect the browser — a config override is required.
        #
        # This file is generated inside the runner's working tree, is never
        # committed, and inherits every other setting from the shared config
        # (timeouts, snapshotPathTemplate, the measured 0.005 tolerance,
        # viewport) so the CI run uses the same visual-regression settings
        # as a local run.
        run: |
          cat > playwright.ci.config.ts <<'EOF'
          // playwright.ci.config.ts — CI-only Playwright config.
          // GENERATED by .github/workflows/ci.yml. Never committed.
          // It only moves the frontend to :5188; every other setting is
          // inherited from the shared playwright.config.ts.
          import { defineConfig } from '@playwright/test'
          import baseConfig from './playwright.config'

          const FRONTEND_PORT = 5188

          export default defineConfig(baseConfig, {
            use: {
              baseURL: `http://localhost:${FRONTEND_PORT}`,
            },
            webServer: {
              command: `npm run dev -- --port ${FRONTEND_PORT} --strictPort`,
              url: `http://localhost:${FRONTEND_PORT}`,
              // In CI nothing else can be listening on 5188: if the port
              // were busy we want a hard failure instead of silently
              // testing someone else's server.
              reuseExistingServer: false,
              timeout: 120_000,
            },
          })
          EOF

      - name: Run the Playwright suite (the backend lives in this step)
        working-directory: TraffSim3D-frontend
        env:
          # VITE_BACKEND_PORT drives the vite dev-server proxy
          # (/api and /health -> localhost:8001). VITE_BACKEND_URL is the
          # direct-fetch counterpart used by AIPlaygroundView /
          # BackendView, so both point at the same backend.
          #
          # `app/main.py`'s CORS allow-list covers 5173, 4173 and 5188
          # (both `localhost` and `127.0.0.1`), so a *cross-origin* call
          # from the CI frontend on :5188 to the backend on :8001 is
          # accepted by the browser.
          VITE_BACKEND_PORT: '8001'
          VITE_BACKEND_URL: 'http://localhost:8001'
          # The base URL of the REAL backend, used by the one spec that
          # talks to it without stubbing. That spec is opt-in (it starts
          # a real PPO run and would leave the shared training status
          # behind for every later spec), so it skips itself here —
          # `E2E_REAL_TRAINING` is deliberately not set in THIS job. The
          # variable is still passed so the skip reason names the right
          # backend instead of the default :8000.
          #
          # The real run is not untested: the dedicated `e2e-real` job
          # below runs exactly that spec, on its own ports and its own
          # backend, so it can never contaminate this suite.
          E2E_BACKEND_URL: 'http://localhost:8001'
        run: |
          # The backend is started **in this step**, not in an earlier one.
          #
          # A backgrounded process does not reliably survive the boundary
          # between two steps: the runner tears the step's process group
          # down when the step ends, so the next step finds no server and
          # the health check times out. Measured 2026-10-25: this job
          # failed at "Wait for the backend to answer /health" on both
          # runs 74 and 75, while the very same backend starts in a
          # second on this machine.
          #
          # Starting it here keeps it alive for exactly as long as the
          # tests need it, and the uvicorn log lands in this step's own
          # output — so a crash is visible instead of a bare timeout.
          ( cd ../TraffSim3D-backend && exec python -m uvicorn app.main:app --port 8001 ) > /tmp/uvicorn.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill $BACKEND_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/health > /dev/null 2>&1; then
              echo "backend is healthy"
              break
            fi
            if [ "$i" -ge 30 ]; then
              echo "backend did not become healthy within 60s"
              cat /tmp/uvicorn.log || true
              exit 1
            fi
            sleep 2
          done
          set +e
          npx playwright test --config=playwright.ci.config.ts --reporter=list 2>&1 | tee /tmp/playwright.log
          STATUS=${PIPESTATUS[0]}
          set -e
          emit() { local l="${1:0:400}"; echo "::${2}::${l//\%/%25}"; }
          if [ "$STATUS" -ne 0 ]; then
            emit "the Playwright suite failed (exit $STATUS) — the failing specs are named below" error
            grep -E '^[[:space:]]+[0-9]+\) |^[[:space:]]+(Error|Timeout|expect\()' /tmp/playwright.log | head -12 | while IFS= read -r line; do
              emit "$line" error
            done
            emit "--- the tail of the Playwright output follows as warnings ---" error
            tail -30 /tmp/playwright.log | while IFS= read -r line; do
              emit "$line" warning
            done
          fi
          exit "$STATUS"

  e2e-real:
    name: E2E — real PPO training (blocking)
    runs-on: ubuntu-latest
    # ------------------------------------------------------------------
    # THIS JOB IS A GATE, AND IT IS THE ONLY PLACE THE REAL RL PIPELINE
    # RUNS IN CI.
    #
    # `ai-playground-real.spec.ts` is opt-in (`E2E_REAL_TRAINING=1`) and
    # the default `e2e` job skips it on purpose: a real PPO run rewrites
    # the shared training-status document, so every spec that runs after
    # it would read a status that belongs to that run. That is exactly
    # how `ai-playground-scene.spec.ts` once clicked a training button
    # the page had already disabled.
    #
    # The price of that decision was that NOTHING exercised the real
    # path: browser -> FastAPI -> SB3 PPO -> status -> UI. It could
    # break silently and the pipeline would stay green. This job closes
    # that hole:
    #
    #   - its own backend on :8011 and its own frontend on :5191, so it
    #     can neither collide with the `e2e` job's :8001 / :5188 nor
    #     contaminate the default suite's shared state,
    #   - its own RL data directory, so the run starts from a clean
    #     status document. A leftover status would let the spec pass
    #     without a run ever having happened.
    #   - the backend installed WITH the `rl` extra, so
    #     stable-baselines3 + torch are really present. Without them the
    #     trainer silently falls back to dry-run (a fabricated reward
    #     curve) and the "real" run proves nothing.
    #   - a setup step that ASSERTS `sb3_available` and fails the job
    #     when it is false, plus a spec that fails instead of skipping.
    #     A skipped real-training test looks exactly like a passing one
    #     in a CI report, so both the job and the spec refuse to skip.
    #
    # Budget: ONE 200-step PPO run. Measured on a developer machine
    # (CPU): the trainer reaches its first reward at ~9 s and finishes at
    # ~13 s. A hosted runner is slower, so the spec allows 4 min for the
    # run to complete; the job allows 25 min in total, most of which is
    # the torch install.
    # ------------------------------------------------------------------
    timeout-minutes: 25
    defaults:
      run:
        working-directory: TraffSim3D-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: TraffSim3D-backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: TraffSim3D-frontend/package-lock.json

      - name: Install the backend (with the rl extra — SB3 + torch)
        # The `rl` extra is the whole point of this job: without
        # stable-baselines3 the trainer degrades to dry-run and the run
        # produces a fake curve. Same mirror-first / pypi.org-fallback
        # pattern the other backend jobs use.
        working-directory: TraffSim3D-backend
        run: |
          python -m pip install -e ".[rl]" \
            || python -m pip install -e ".[rl]" --index-url https://pypi.org/simple

      - name: Install the frontend
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run the real PPO training e2e (the backend lives in this step)
        # E2E_REAL_TRAINING=1 is the spec's opt-in gate; the npm script
        # sets it too, but it is spelled out here so the job reads on its
        # own.
        #
        # VITE_BACKEND_URL points at the FRONTEND's own origin on
        # purpose. The backend's CORS allow-list covers :5173, :4173 and
        # :5188 — not :5191 — so a cross-origin call from the page on
        # :5191 to the backend on :8011 is refused by the browser (no
        # Access-Control-Allow-Origin header), and the page can then
        # neither read /rl/status nor POST /rl/train. Pointing
        # VITE_BACKEND_URL at the page's own origin makes those calls
        # same-origin, and the vite dev proxy (VITE_BACKEND_PORT)
        # forwards /api to the backend on :8011. That is also the
        # production topology: one origin serves the app and the API.
        #
        # The spec itself talks to the backend directly (Node, no CORS)
        # through E2E_BACKEND_URL.
        #
        # The backend is started **in this step**: a backgrounded process
        # does not reliably survive the boundary between two steps (the
        # runner tears the step's process group down), so the next step
        # would find no server. Measured 2026-10-25: this job failed at
        # the health/capabilities wait on runs 74 and 75 while the same
        # backend starts in a second on this machine.
        env:
          E2E_REAL_TRAINING: '1'
          E2E_FRONTEND_PORT: '5191'
          E2E_BACKEND_URL: 'http://localhost:8011'
          VITE_BACKEND_PORT: '8011'
          VITE_BACKEND_URL: 'http://localhost:5191'
          # The hosted runners have no GPU; pin the device so the job is
          # deterministic on any runner image.
          E2E_REAL_DEVICE: 'cpu'
          # A dedicated RL data directory keeps this job's status document
          # and checkpoints away from everything else, and guarantees the
          # run starts from a clean slate.
          TRAFFIC_RL_DATA_DIR: ${{ github.workspace }}/TraffSim3D-backend/.data/rl-real-e2e
          E2E_REAL_STEPS: '200'
        run: |
          ( cd ../TraffSim3D-backend && exec python -m uvicorn app.main:app --port 8011 ) > /tmp/uvicorn-real.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill $BACKEND_PID 2>/dev/null || true' EXIT
          # The capabilities endpoint imports torch on the first call, which
          # takes far longer than a plain /health probe — so the wait loop
          # asks for capabilities, not /health, and allows a generous
          # budget for the cold import.
          #
          # This FAILS the job when SB3 is missing. It must: a job that
          # quietly skipped the real run would be worse than no job.
          emit() { local l="${1:0:400}"; echo "::${2}::${l//\%/%25}"; }
          # 90 x 2 s = 180 s. The capabilities endpoint imports torch on the
          # first call, and on a hosted runner that cold import (2 GB of
          # packages, cold page cache) can outlast the old 120 s budget —
          # the job as a whole allows 25 min, so there is room to wait
          # longer rather than to fail a backend that was merely slow.
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8011/api/v1/rl/capabilities > /tmp/rl-caps.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ ! -s /tmp/rl-caps.json ]; then
            echo "backend did not answer /api/v1/rl/capabilities within 180s"
            emit "the backend never answered /api/v1/rl/capabilities within 180s" error
            emit "--- the uvicorn log follows as warnings ---" error
            tail -40 /tmp/uvicorn-real.log 2>/dev/null | while IFS= read -r line; do
              emit "$line" warning
            done
            exit 1
          fi
          cat /tmp/rl-caps.json
          python -c "import json,sys;c=json.load(open('/tmp/rl-caps.json'));print('sb3_available =',c['sb3_available'],'| torch =',c['torch_version'],'| cuda =',c['cuda_available']);sys.exit(0 if c['sb3_available'] else 'stable-baselines3 is NOT installed -> the real-training run would silently degrade to dry-run')"
          set +e
          npm run test:e2e:real 2>&1 | tee /tmp/playwright-real.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            emit "the real-PPO e2e failed (exit $STATUS) — the details follow" error
            tail -40 /tmp/playwright-real.log | while IFS= read -r line; do
              emit "$line" warning
            done
          fi
          exit "$STATUS"
